
# .github/workflows/build.yml
# SCMusic / ShrubHub build workflow
# Credits: Shrubbery / ShrubHub and upstream SCMusicPlusRevanced contributors.

name: Build SCMusic IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: scmusic-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      THEOS: ${{ github.workspace }}/theos
      IPA_URL: https://github.com/zoinkdoggie94/ipa-and-dns-stuff/releases/download/D/com.soundcloud.TouchApp-8.81.0-Decrypted.ipa
      APP_NAME: SCMusic
      BUNDLE_ID: com.scmusic.TouchApp.shrubhub
      APP_VERSION: 8.81.0

    steps:
      - name: Checkout tweak source
        uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Cache Theos SDKs
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-master-scmusic-v1

      - name: Download iOS SDKs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/theos/sdks/archive/refs/heads/master.zip \
            -o /tmp/theos-sdks.zip
          unzip -q /tmp/theos-sdks.zip -d /tmp
          mkdir -p "$THEOS/sdks"
          cp -a /tmp/sdks-master/*.sdk "$THEOS/sdks/"
          test -n "$(find "$THEOS/sdks" -maxdepth 1 -name '*.sdk' -print -quit)"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid make

      - name: Compile conservative tweak
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make clean
          make FINALPACKAGE=1
          mkdir -p release
          test -s .theos/obj/SCMusicPlusRevanced.dylib
          cp .theos/obj/SCMusicPlusRevanced.dylib \
            release/SCMusicPlusRevanced.dylib
          echo 'Compiled dylib dependencies:'
          otool -L release/SCMusicPlusRevanced.dylib

      - name: Download decrypted SoundCloud IPA
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            --max-time 1800 "$IPA_URL" -o original.ipa
          test -s original.ipa
          unzip -tqq original.ipa
          python3 - <<'PY'
          import plistlib
          import zipfile
          with zipfile.ZipFile('original.ipa') as ipa:
              infos = [
                  name for name in ipa.namelist()
                  if name.startswith('Payload/')
                  and name.endswith('.app/Info.plist')
                  and name.count('/') == 2
              ]
              if len(infos) != 1:
                  raise SystemExit('Expected exactly one primary app')
              info = plistlib.loads(ipa.read(infos[0]))
              if info.get('CFBundleIdentifier') != 'com.soundcloud.TouchApp':
                  raise SystemExit('The downloaded IPA is not SoundCloud')
              print('Original app:', info.get('CFBundleIdentifier'))
              print('Original version:', info.get('CFBundleShortVersionString'))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cyan injector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/refs/heads/main.zip
          cyan --version

      # Same name and bundle ID, but no dylib, for crash diagnosis.
      - name: Build renamed no-tweak control IPA
        shell: bash
        run: |
          set -euo pipefail
          cyan -i original.ipa \
            -o release/SCMusic-8.81.0-NoTweak-TEST.ipa \
            -n "$APP_NAME" \
            -b "$BUNDLE_ID" \
            --overwrite

      - name: Build renamed injected IPA
        shell: bash
        run: |
          set -euo pipefail
          cyan -i original.ipa \
            -o release/SCMusic-8.81.0-Injected.ipa \
            -f release/SCMusicPlusRevanced.dylib \
            -n "$APP_NAME" \
            -b "$BUNDLE_ID" \
            --overwrite

      - name: Verify output IPAs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          import zipfile
          import os
          expected_id = os.environ['BUNDLE_ID']
          for filename, injected in (
              ('release/SCMusic-8.81.0-NoTweak-TEST.ipa', False),
              ('release/SCMusic-8.81.0-Injected.ipa', True),
          ):
              with zipfile.ZipFile(filename) as ipa:
                  if ipa.testzip() is not None:
                      raise SystemExit(f'ZIP corruption: {filename}')
                  names = set(ipa.namelist())
                  infos = [
                      name for name in names
                      if name.startswith('Payload/')
                      and name.endswith('.app/Info.plist')
                      and name.count('/') == 2
                  ]
                  if len(infos) != 1:
                      raise SystemExit(f'Invalid app layout: {filename}')
                  info = plistlib.loads(ipa.read(infos[0]))
                  if info.get('CFBundleIdentifier') != expected_id:
                      raise SystemExit(f'Wrong bundle ID: {filename}')
                  if info.get('CFBundleDisplayName', info.get('CFBundleName')) != 'SCMusic':
                      raise SystemExit(f'Wrong app name: {filename}')
                  app_path = infos[0].rsplit('/', 1)[0]
                  dylib = f'{app_path}/Frameworks/SCMusicPlusRevanced.dylib'
                  if injected:
                      if dylib not in names:
                          raise SystemExit('Cyan did not embed the dylib')
                      executable = info.get('CFBundleExecutable')
                      executable_path = f'{app_path}/{executable}'
                      if executable_path not in names:
                          raise SystemExit('App executable missing')
                      binary = ipa.read(executable_path)
                      if b'SCMusicPlusRevanced.dylib' not in binary:
                          raise SystemExit('App executable does not load the dylib')
                  elif dylib in names:
                      raise SystemExit('Control IPA contains the tweak')
                  print('Verified:', filename)
          PY

      - name: Upload no-tweak test IPA to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SCMusic-NoTweak-Test
          path: release/SCMusic-8.81.0-NoTweak-TEST.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scmusic-8.81.0-build-${{ github.run_number }}
          name: SCMusic 8.81.0 (Build ${{ github.run_number }})
          body: |
            # SCMusic 8.81.0 — ShrubHub

            **App name:** SCMusic
            **Bundle ID:** `com.scmusic.TouchApp.shrubhub`
            **Base:** SoundCloud 8.81.0
            **Tweak:** SCMusicPlusRevanced (conservative compatibility hooks)

            `SCMusic-8.81.0-Injected.ipa` contains the injected tweak.
            `SCMusicPlusRevanced.dylib` contains the standalone tweak.

            You must sign the IPA using your own certificate (for example, with ShrubSign).

            The SoundCloud 8.81.0 base app may itself crash when sideloaded.
            To isolate the problem, download the no-tweak TEST IPA from the
            GitHub Actions artifacts for this workflow run and sign it the same way.
            If that IPA crashes too, changing the dylib injection won't fix it.

            Compatibility note: the conservative tweak intentionally omits
            version-specific initializer hooks until SoundCloud 8.81.0 is verified.

            **Build automation:** Shrubbery / ShrubHub.
            **Original tweak:** SCMusicPlusRevanced contributors.
            Redistribute only when you have permission to share the base application.
          files: |
            release/SCMusic-8.81.0-Injected.ipa
            release/SCMusicPlusRevanced.dylib
          fail_on_unmatched_files: true
